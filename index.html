<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cargando presentación…</title>
<style>
html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#0C213D;color:#fff;font-family:Arial,Helvetica,sans-serif}
main{text-align:center}.spinner{width:44px;height:44px;border:4px solid #ffffff44;border-top-color:#fff;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}p{opacity:.8}
</style>
</head>
<body>
<main><div class="spinner"></div><strong>Cargando presentación final…</strong><p>Un momento.</p></main>
<script>
(async()=>{
  try{
    const files=['part00','part01','part02','part03','part04','part05','part06'];
    const parts=await Promise.all(files.map(n=>fetch('chunks/'+n+'.txt?v=final2').then(r=>{
      if(!r.ok) throw new Error('No se pudo cargar '+n);
      return r.text();
    })));
    const html=parts.join('');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<main><strong>No se pudo cargar la presentación.</strong><p>Actualiza la página en unos segundos.</p></main>';
  }
})();
</script>
</body>
</html>
